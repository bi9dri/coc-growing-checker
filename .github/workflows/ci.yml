name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

  vrt:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: acceptance
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'vrt:accepted'; then
            gh pr edit "$PR_NUMBER" --remove-label vrt:accepted
            echo "accepted=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.acceptance.outputs.accepted != 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        if: steps.acceptance.outputs.accepted != 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.acceptance.outputs.accepted != 'true'
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.acceptance.outputs.accepted != 'true'
      - id: playwright-version
        if: steps.acceptance.outputs.accepted != 'true'
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        if: steps.acceptance.outputs.accepted != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - if: steps.acceptance.outputs.accepted != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.acceptance.outputs.accepted != 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Compare against baselines
        if: github.event_name == 'pull_request' && steps.acceptance.outputs.accepted != 'true'
        run: pnpm vrt
      - name: Refresh baselines
        if: github.event_name == 'push'
        run: pnpm vrt:update
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: vrt-report
          path: |
            playwright-report/vrt
            test-results
          retention-days: 7
      - name: Upload refreshed baselines
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vrt-baselines
          path: tests/vrt
          retention-days: 1
          if-no-files-found: error

  vrt-baselines:
    needs: vrt
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Remove stale snapshots
        run: find tests/vrt -type d -name '*-snapshots' -prune -exec rm -rf {} +
      - uses: actions/download-artifact@v8.0.2
        with:
          name: vrt-baselines
          path: tests/vrt
      - name: Verify baselines
        run: |
          if ! find tests/vrt -type f -name '*.png' | grep -q .; then
            echo "No baseline PNGs in the artifact" >&2
            exit 1
          fi
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)tests/vrt/**/*-snapshots/**'
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "chore(vrt): update screenshot baselines [skip ci]"
          git push origin HEAD:main
